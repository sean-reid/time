name: preview

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  upload:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: upload
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - id: preview
        name: preview url
        env:
          OUT: ${{ steps.upload.outputs.command-output }}
        run: |
          url=$(printf '%s\n' "$OUT" | grep -oE 'https://pr-[0-9]+-[a-z0-9.-]+\.workers\.dev' | head -1)
          [ -n "$url" ] || { echo "no preview url in wrangler output" >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: comment preview url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Preview: $URL"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.body | startswith("Preview: ")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi
      - name: wait for preview
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: curl -sfo /dev/null --retry 20 --retry-delay 3 --retry-all-errors "$URL"
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: ${{ steps.preview.outputs.url }}
          runs: 3
          configPath: lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: lighthouse summary
        if: ${{ !cancelled() }}
        run: node scripts/lh-summary.mjs
